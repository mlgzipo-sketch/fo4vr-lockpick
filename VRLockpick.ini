; VRLockpick: pick locks with your hands in Fallout 4 VR.
; Needs ROCK and FRIK. Log: Documents\My Games\Fallout4VR\F4SE\VRLockpick.log

[General]
; 1 = write every pick/lock angle change to the log (for testing).
bDebugLog=1

[Control]
; 1 = hold the tools and move them with the hands:
;   pin (left hand): hold the trigger to take it in the fingers, then move the
;   hand around the keyhole and the pin follows in an arc; let go of the
;   trigger and it stays where it is.
;   screwdriver (right hand): twist the hand like turning a bolt; the lock
;   follows the twist, a quarter turn opens it.
; 0 = roll the wrists instead (old way, values in [Turn]).
bArmControl=1
; 1 = fingers close around the tools while lockpicking (needs FRIK).
bGripFingers=1
; 1 = the pin moves only while the trigger is held.
bPinNeedsTrigger=1
; -1 = flip which way the pin goes when you move the hand.
fArmPickSign=1
; Lock degrees per degree of screwdriver twist (1 = a quarter turn opens it).
fScrewLockDegreesPerTwist=1.0
; Twist past this many lock degrees to start turning, back under the second to let go.
fArmTurnStartDegrees=10
fArmTurnStopDegrees=5

[Pick]
; 1 = the bobby pin follows the roll of your hand around the fingers.
bDrivePick=1
; 1 = left hand holds the pin and the right hand the screwdriver (as in the game's
; lockpicking screen), 0 = the other way round.
bLeftHandPick=1
; How many degrees the pin turns per degree the hand rolls (or moves around the keyhole).
fPickDegreesPerHandDegree=1.0
; Pin angle limit, degrees left and right.
fMaxPickAngle=90
; 1 = turn the pin model with the hand (the game itself only turns it with the
; stick). fPinModelSign=-1 flips its direction.
bSetPinModel=1
fPinModelSign=1

[Turn]
; Wrist mode (bArmControl=0) values below.
; 1 = the screwdriver hand (right by default) turns the lock.
; The game's turn button still works too.
bTurnWithHand=1
; Roll past this many degrees to start turning...
fTurnStartDegrees=25
; ...and back under this to let go.
fTurnStopDegrees=15
; Roll at which the lock turns at full speed (like the stick pushed all the way).
fTurnFullDegrees=60
